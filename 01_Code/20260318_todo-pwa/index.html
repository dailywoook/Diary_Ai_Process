<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>할 일 목록</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8365d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Todo" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f5f7;
      --surface:      #ffffff;
      --surface-hover:#f9f9fb;
      --border:       #e8e8ec;
      --border-focus: #d0d0d8;
      --text:         #1a1a1e;
      --text-secondary: #6e6e80;
      --text-muted:   #adadba;
      --accent:       #e8365d;
      --accent-hover: #d42f54;
      --accent-soft:  #fdeef1;
      --done-text:    #c0c0cc;
      --radius-sm:    6px;
      --radius:       10px;
      --transition:   .15s ease;
      --safe-top:     env(safe-area-inset-top, 0px);
      --safe-bottom:  env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
                   '맑은 고딕', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 540px;
    }

    /* Header */
    header { margin-bottom: 24px; }

    .header-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .header-label .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.03em;
      line-height: 1.2;
    }

    header p {
      margin-top: 5px;
      color: var(--text-secondary);
      font-size: .875rem;
    }

    /* Input */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #todo-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      -webkit-appearance: none;
    }

    #todo-input::placeholder { color: var(--text-muted); }

    #todo-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 54, 93, .1);
    }

    #add-btn {
      padding: 11px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: .9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #add-btn:hover  { background: var(--accent-hover); }
    #add-btn:active { background: var(--accent-hover); opacity: .85; }

    /* List Container */
    .list-container {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      overflow: hidden;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1.5px solid var(--border);
      gap: 8px;
    }

    .count {
      font-size: .8125rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .count strong { color: var(--accent); font-weight: 700; }

    .filters {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .filters button {
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      background: transparent;
      font-size: .8rem;
      font-family: inherit;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .filters button:hover { color: var(--text); }

    .filters button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px var(--border);
    }

    /* Todo Items */
    #todo-list { list-style: none; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .todo-item:last-child { border-bottom: none; }

    @media (hover: hover) {
      .todo-item:hover { background: var(--surface-hover); }
      .todo-item:hover .delete-btn { opacity: 1; }
    }

    /* 터치 기기에서는 삭제 버튼 항상 표시 */
    @media (hover: none) {
      .delete-btn { opacity: 0.5 !important; }
    }

    /* Checkbox */
    .todo-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border: 1.5px solid var(--border-focus);
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: all var(--transition);
      background: var(--surface);
    }

    .todo-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 5px;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .todo-text {
      flex: 1;
      font-size: .9375rem;
      line-height: 1.5;
      word-break: break-all;
      transition: color var(--transition);
      letter-spacing: -.01em;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: .9rem;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      line-height: 1;
      transition: color var(--transition), background var(--transition);
      flex-shrink: 0;
      opacity: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .delete-btn:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Empty State */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 1.5rem;
      margin-bottom: 10px;
      display: block;
      opacity: .5;
    }

    .empty-state p { font-size: .875rem; }

    /* Footer */
    .footer-bar {
      display: flex;
      justify-content: flex-end;
      padding: 10px 16px;
      border-top: 1.5px solid var(--border);
      background: var(--bg);
    }

    #clear-btn {
      background: none;
      border: 1.5px solid var(--border-focus);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: .8rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    #clear-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    #clear-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    #clear-btn:disabled:hover {
      border-color: var(--border-focus);
      color: var(--text-secondary);
      background: none;
    }
  </style>
</head>
<body>

<div class="app">
  <header>
    <div class="header-label"><span class="dot"></span>My Tasks</div>
    <h1>할 일 목록</h1>
    <p>오늘 해야 할 일들을 관리하세요</p>
  </header>

  <div class="input-row">
    <input
      type="text"
      id="todo-input"
      placeholder="새로운 할 일을 입력하세요..."
      maxlength="200"
      autocomplete="off"
      enterkeyhint="done"
    />
    <button id="add-btn">추가</button>
  </div>

  <div class="list-container">
    <div class="filter-bar">
      <span class="count">남은 항목 <strong id="remaining">0</strong>개</span>
      <div class="filters">
        <button class="active" data-filter="all">전체</button>
        <button data-filter="active">진행 중</button>
        <button data-filter="completed">완료</button>
      </div>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer-bar">
      <button id="clear-btn" disabled>완료 항목 삭제</button>
    </div>
  </div>
</div>

<script>
  /* Service Worker 등록 */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  const STORAGE_KEY = 'todo-app-v1';
  let todos  = load();
  let filter = 'all';

  const input      = document.getElementById('todo-input');
  const addBtn     = document.getElementById('add-btn');
  const list       = document.getElementById('todo-list');
  const remaining  = document.getElementById('remaining');
  const clearBtn   = document.getElementById('clear-btn');
  const filterBtns = document.querySelectorAll('.filters button');

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function filtered() {
    if (filter === 'active')    return todos.filter(t => !t.done);
    if (filter === 'completed') return todos.filter(t =>  t.done);
    return todos;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render() {
    const visible = filtered();
    list.innerHTML = '';

    if (visible.length === 0) {
      const msg  = filter === 'completed' ? '완료된 항목이 없습니다.'
                 : filter === 'active'    ? '진행 중인 항목이 없습니다.'
                 : '할 일을 추가해 보세요.';
      const icon = filter === 'completed' ? '✓' : '○';
      list.innerHTML = `
        <li class="empty-state">
          <span class="icon">${icon}</span>
          <p>${msg}</p>
        </li>`;
    } else {
      visible.forEach(todo => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' done' : '');
        li.dataset.id = todo.id;
        li.innerHTML = `
          <input type="checkbox" ${todo.done ? 'checked' : ''} aria-label="완료 여부 토글" />
          <span class="todo-text">${escHtml(todo.text)}</span>
          <button class="delete-btn" aria-label="삭제">✕</button>`;
        list.appendChild(li);
      });
    }

    const activeCount    = todos.filter(t => !t.done).length;
    const completedCount = todos.filter(t =>  t.done).length;

    remaining.textContent = activeCount;
    clearBtn.disabled     = completedCount === 0;
    clearBtn.textContent  = completedCount > 0
      ? `완료 항목 삭제 (${completedCount})`
      : '완료 항목 삭제';
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) {
      input.focus();
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 350);
      return;
    }
    todos.unshift({ id: uid(), text, done: false });
    save(); render();
    input.value = '';
    input.focus();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save(); render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.done);
    save(); render();
  }

  function setFilter(f) {
    filter = f;
    filterBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === f));
    render();
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  list.addEventListener('change', e => {
    if (e.target.type === 'checkbox') {
      toggleTodo(e.target.closest('.todo-item').dataset.id);
    }
  });

  list.addEventListener('click', e => {
    const btn = e.target.closest('.delete-btn');
    if (btn) deleteTodo(btn.closest('.todo-item').dataset.id);
  });

  clearBtn.addEventListener('click', clearCompleted);
  filterBtns.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));

  const ss = document.createElement('style');
  ss.textContent = `
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      20%      { transform:translateX(-5px); }
      40%      { transform:translateX(5px); }
      60%      { transform:translateX(-3px); }
      80%      { transform:translateX(3px); }
    }
    .shake { animation:shake .32s ease; border-color:#e8365d !important; }
  `;
  document.head.appendChild(ss);

  render();
</script>
</body>
</html>
